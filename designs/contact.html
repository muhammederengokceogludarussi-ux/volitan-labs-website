<body class="relative flex flex-col min-h-screen">

    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-40 w-[95%] sm:w-full max-w-3xl px-2">
        <div class="flex items-center justify-between px-4 sm:px-6 py-3 rounded-full bg-black/60 backdrop-blur-2xl border border-white/10">

            <div class="hidden md:flex items-center gap-8">

    <main class="relative z-10 pt-40 md:pt-48 pb-32 px-4 sm:px-6 max-w-[800px] mx-auto flex-1 w-full flex flex-col justify-center">
        <header class="text-center mb-16">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <a href="mailto:hello@volitan.com" class="bento-card p-8 flex flex-col items-center text-center group hover:-translate-y-2">
                <div class="w-14 h-14 rounded-full border border-white/10 flex items-center justify-center text-zinc-400 mb-6 group-hover:bg-white group-hover:border-white group-hover:text-black transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <h3 class="text-white font-bold mb-1 text-lg">Email</h3>
                <p class="text-sm text-zinc-500 font-mono">hello@volitan.com</p>

            <a href="#" class="bento-card p-8 flex flex-col items-center text-center group hover:-translate-y-2">

                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
                </div>
                <h3 class="text-white font-bold mb-1 text-lg">GitHub</h3>
                <p class="text-sm text-zinc-500 font-mono">@volitanlabs</p>
            </a>

            <a href="#" class="bento-card p-8 flex flex-col items-center text-center group hover:-translate-y-2">
                <div class="w-14 h-14 rounded-full border border-white/10 flex items-center justify-center text-zinc-400 mb-6 group-hover:bg-[#0a66c2] group-hover:border-[#0a66c2] group-hover:text-white transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>

            </a>
        </div>
    </main>

    <!-- Shared Background Script -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let width, height;

            function resizeParams() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resizeParams);
            resizeParams();

            const particles = [];
            const particleCount = Math.floor(width / 25);
            const connectionDistance = 140;

            let mouseInfo = { x: -1000, y: -1000, radius: 200 };
            window.addEventListener('mousemove', e => {
                mouseInfo.x = e.clientX;
                mouseInfo.y = e.clientY;
            });
            window.addEventListener('mouseout', () => {
                mouseInfo.x = -1000;
                mouseInfo.y = -1000;
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 1.5 + 0.5;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;

                    let dx = mouseInfo.x - this.x;
                    let dy = mouseInfo.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouseInfo.radius) {
                        let forceX = dx / distance;
                        let forceY = dy / distance;
                        let force = (mouseInfo.radius - distance) / mouseInfo.radius;
                        this.x -= forceX * force * 1.5;
                        this.y -= forceY * force * 1.5;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function animateCanvas() {
                requestAnimationFrame(animateCanvas);
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();

                    for (let j = i; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < connectionDistance) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - distance / connectionDistance * 0.1})`;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                    
                    let dxMouse = particles[i].x - mouseInfo.x;
                    let dyMouse = particles[i].y - mouseInfo.y;
                    let distanceMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                    if (distanceMouse < mouseInfo.radius) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(139, 108, 240, ${0.4 - distanceMouse / mouseInfo.radius * 0.4})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouseInfo.x, mouseInfo.y);
                        ctx.stroke();
                    }
                }
            }
            animateCanvas();
        }
    </script>
</body>
</html>
